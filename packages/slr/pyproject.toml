[project]
name = "slr"
version = "0.1.0"
description = "ASL fingerspelling recognition: data, training and evaluation"
requires-python = ">=3.12,<3.13"
# Pinned exactly: a newer torch, timm or mediapipe can quietly change predictions.
# Bump them together and re-check accuracy.
dependencies = [
    "torch==2.13.0",
    "torchvision==0.28.0",
    "timm==1.0.28",
    "numpy==1.26.4",
    "pillow==12.3.0",
    # 1.x crashes on macOS arm64 ("DrishtiMetalHelper: Service is unavailable").
    "mediapipe==0.10.21",
    "opencv-contrib-python==4.11.0.86",
]

[project.optional-dependencies]
# Only needed to download datasets.
data = ["kaggle>=1.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/slr"]
