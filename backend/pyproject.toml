[project]
name = "slr"
version = "0.1.0"
description = "Signer-honest sign language recognition with vision transformers"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.2",
    "torchvision>=0.17",
    "timm>=1.0.9",
    "numpy>=1.26",
    "pillow>=10.2",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "python-multipart>=0.0.9",
    "pydantic>=2.6",
]

[project.optional-dependencies]
data = ["kaggle>=1.6", "huggingface-hub>=0.23"]
dev = ["pytest>=8.0"]

[project.scripts]
slr-api = "slr.api:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/slr"]

[tool.pytest.ini_options]
testpaths = ["tests"]
